supergraph:
  listen: 127.0.0.1:4000
  introspection: true
headers:
  all:
    request:
      - propagate:
          named: authorization
# Log one line per subgraph request, so the subgraphs an operation touches show up in `pnpm dev`.
# `warn` because rover dev only passes through router output at WARN and above.
telemetry:
  instrumentation:
    events:
      subgraph:
        request: warn
